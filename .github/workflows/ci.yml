name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Remove generated plugin output
        run: rm -rf plugins/*/lib

      - name: Verify
        run: pnpm run check

      - name: Install Chromium
        run: pnpm --filter dsh-mindppt-playground exec playwright install --with-deps chromium

      - name: Browser smoke test
        run: pnpm run test:browser
