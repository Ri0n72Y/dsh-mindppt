name: DSH deploy Windows smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/deploy-dsh.mjs
      - scripts/deploy-runner-smoke.mjs
      - plugins/dsh-mindppt/tests/deploy-script.test.mjs
      - .github/workflows/deploy-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exercise real Windows subprocess path
        run: node scripts/deploy-runner-smoke.mjs
